name: Build Solaris iOS Probe

# One push runs the checks and produces the matching app + Windows receiver.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install project generator
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
          xcodebuild -version
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate source and receiver
        run: |
          python3 scripts/check_project.py
          python3 -m unittest discover -s receiver -p 'test_*.py' -v
          node scripts/check_viewer.mjs
          node --test tests/screen_receiver.test.mjs
      - name: Test shared configuration validation
        run: |
          mkdir -p build
          swiftc ios/Shared/ProbeShared.swift tests/ProbeConfigTests.swift -o build/config-tests
          build/config-tests
      - name: Build and package for local re-signing
        run: bash scripts/build_ios.sh
      - name: Upload re-signing candidate
        uses: actions/upload-artifact@v4
        with:
          name: Solaris-0.3.1-app-and-receiver
          path: |
            dist/SolarisProbe-resign.ipa
            dist/Solaris-Windows-0.3.1.html
            dist/START_HERE_KO.md
          if-no-files-found: error
          retention-days: 3
