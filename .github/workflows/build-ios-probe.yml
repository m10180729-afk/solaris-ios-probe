name: Build Solaris integrated test

# One push runs the checks and produces the matching app + Windows receiver.
on:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-rtp-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build and test native RTP packetizer
        run: |
          dotnet build windows-native/Solaris.Transport.Tests -c Release
          dotnet windows-native/Solaris.Transport.Tests/bin/Release/net8.0/Solaris.Transport.Tests.dll
      - name: Test native adapter session and viewer isolation
        run: dotnet run --project windows-native/Solaris.Adapter.Tests -c Release
      - name: Generate H264 interoperability fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          mkdir -p build
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=1920x1080:rate=60 -t 3 -c:v libx264 -preset ultrafast -profile:v baseline -level:v 4.2 -pix_fmt yuv420p -b:v 6M -maxrate 8M -bufsize 8M -g 30 -bf 0 -x264-params aud=1:repeat-headers=1 -f h264 build/rtp-fixture.h264
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          # Bundled Linux Chromium excludes H.264; this gate requires real Chrome.
          npx playwright install chrome
      - name: Decode native SRTP in two browsers and exercise recovery
        run: node scripts/native_rtp_browser_test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Solaris-1.0-rtp-test-evidence
          path: build/rtp-diagnostics/
          if-no-files-found: warn
          retention-days: 7
  windows-native:
    needs: native-rtp-test
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Verify scheduling with Windows timers
        shell: pwsh
        run: |
          dotnet run --project windows-native/Solaris.Auth.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project windows-native/Solaris.Window.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project windows-native/Solaris.Adapter.Tests -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project windows-native/Solaris.Transport.Tests -c Release -- --unit-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build self-contained Solaris Windows sender
        shell: pwsh
        run: |
          dotnet restore windows-native/SolarisNativeHost/SolarisNativeHost.csproj
          dotnet publish windows-native/SolarisNativeHost/SolarisNativeHost.csproj -c Release -r win-x64 --self-contained true -o dist/native
      - name: Bundle native FFmpeg hardware encoder
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile build-ffmpeg.zip
          Expand-Archive build-ffmpeg.zip -DestinationPath build-ffmpeg
          $ffmpeg = Get-ChildItem build-ffmpeg -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe not found" }
          Copy-Item $ffmpeg.FullName dist/native/ffmpeg.exe
          Copy-Item windows-native/THIRD_PARTY_NOTICES.txt dist/native/THIRD_PARTY_NOTICES.txt
      - name: Verify integrated package
        shell: pwsh
        run: |
          & dist/native/SolarisNativeHost.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item windows-native/README_KO.md dist/native/START_NATIVE_HOST_KO.md
      - name: Create single Windows installer
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile dist/MicrosoftEdgeWebview2Setup.exe
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { choco install innosetup --no-progress -y }
          & $compiler windows-native/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows Solaris app
        uses: actions/upload-artifact@v4
        with:
          name: Solaris-Windows-1.0
          path: |
            dist/native/
            dist/windows/Solaris-Windows-1.0-Setup.exe
          if-no-files-found: error
          retention-days: 7
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser fixture
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Test accounts, authorization, bounded file protocol
        run: |
          python3 scripts/check_build54_capture.py
          python3 scripts/check_build54_engine.py
          npm test
          npm run test:database
      - name: Test real decoded video, five viewers and resumed files
        run: |
          node scripts/screen_browser_test.mjs
          node scripts/unified_ui_test.mjs
          node scripts/unified_browser_test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Solaris-1.0-unified-test-evidence
          path: |
            build/build54-capture-evidence/results.json
            build/build54-engine-evidence/results.json
            build/unified-evidence/*results.json
            build/ui-evidence/
          retention-days: 7
      - name: Keep browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: build/browser-diagnostics/
          if-no-files-found: ignore
          retention-days: 3
  android-app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The v3 default includes obsolete "tools", removed from Google's repository.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build integrated Android app
        run: |
          set -o pipefail
          python3 scripts/prepare_android_receiver.py
          python3 scripts/prepare_unified.py
          gradle -p android :app:testDebugUnitTest :app:assembleRelease
          mkdir -p dist/android
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/android/Solaris-Android-1.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" dist/android/apksigner.jar
          sha256sum dist/android/apksigner.jar > dist/android/apksigner.jar.sha256
          printf "%s\n" "Unsigned release APK; signed locally with the persistent Solaris release key after CI verification." > dist/android/Solaris-Android-1.0-signature.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/android/Solaris-Android-1.0-unsigned.apk > dist/android/Solaris-Android-1.0-metadata.txt
          python3 -m unittest discover -s tests -p 'test_android_pages.py' -v 2>&1 | tee dist/android/Solaris-Android-1.0-16kb-tests.txt
          SOLARIS_ELF_EXIT=0
          python3 scripts/check_android_pages.py --phone-apk --receive-only --apk dist/android/Solaris-Android-1.0-unsigned.apk --output dist/android/Solaris-Android-1.0-16kb-elf.json || SOLARIS_ELF_EXIT=$?
          SOLARIS_ZIP_EXIT=0
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 dist/android/Solaris-Android-1.0-unsigned.apk > dist/android/Solaris-Android-1.0-16kb-zip.txt || SOLARIS_ZIP_EXIT=$?
          if [ "$SOLARIS_ELF_EXIT" -ne 0 ] || [ "$SOLARIS_ZIP_EXIT" -ne 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Solaris-Android-1.0-packaging
          path: |
            dist/android/Solaris-Android-1.0-unsigned.apk
            dist/android/Solaris-Android-1.0-signature.txt
            dist/android/Solaris-Android-1.0-metadata.txt
            dist/android/Solaris-Android-1.0-16kb-elf.json
            dist/android/Solaris-Android-1.0-16kb-zip.txt
            dist/android/Solaris-Android-1.0-16kb-tests.txt
          if-no-files-found: error
          retention-days: 7
      - name: Keep Android test and signing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Solaris-Android-1.0-test-evidence
          path: |
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/tests/testDebugUnitTest/
            dist/android/apksigner.jar
            dist/android/apksigner.jar.sha256
            dist/android/Solaris-Android-1.0-signature.txt
            dist/android/Solaris-Android-1.0-metadata.txt
            dist/android/Solaris-Android-1.0-16kb-elf.json
            dist/android/Solaris-Android-1.0-16kb-zip.txt
            dist/android/Solaris-Android-1.0-16kb-tests.txt
          if-no-files-found: warn
          retention-days: 7
  build:
    needs: [browser-test, native-rtp-test]
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install project generator
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
          xcodebuild -version
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate source and receiver
        run: |
          python3 scripts/prepare_unified.py
          python3 scripts/check_project.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m unittest discover -s receiver -p 'test_*.py' -v
          node scripts/check_viewer.mjs
          node --test tests/screen_receiver.test.mjs tests/desktop_share.test.mjs
      - name: Test shared configuration validation
        run: |
          mkdir -p build
          swiftc ios/Shared/ProbeShared.swift tests/ProbeConfigTests.swift -o build/config-tests
          build/config-tests
          swiftc ios/Shared/ProcessMetrics.swift tests/ProcessMetricsTests.swift -o build/process-metrics-tests
          build/process-metrics-tests
          swiftc -parse-as-library ios/Shared/AuthCallback.swift tests/AuthCallbackTests.swift -o build/auth-callback-tests
          build/auth-callback-tests
          swiftc -parse-as-library ios/Shared/BroadcastLifetime.swift ios/Tests/BroadcastLifetimeTests.swift -o build/broadcast-lifetime-tests
          build/broadcast-lifetime-tests
      - name: Build and package for local re-signing
        run: bash scripts/build_ios.sh
      - name: Keep actual Xcode project and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Solaris-1.0-xcode-evidence
          path: |
            build/diagnostics/
            build/package.*/Build.xcresult/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload re-signing candidate
        uses: actions/upload-artifact@v4
        with:
          name: Solaris-iPad-1.0
          path: |
            dist/Solaris-1.0.ipa
            dist/START_HERE_KO.md
          if-no-files-found: error
          retention-days: 3
