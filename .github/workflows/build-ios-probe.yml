name: Build Solaris iOS Probe

# One push runs the checks and produces the matching app + Windows receiver.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Build self-contained Solaris launcher
        shell: pwsh
        run: |
          dotnet restore windows-native/SolarisNativeHost/SolarisNativeHost.csproj
          dotnet publish windows-native/SolarisNativeHost/SolarisNativeHost.csproj -c Release -r win-x64 --self-contained true -o dist/native
      - name: Bundle official Apollo GPLv3 native engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.4.6'
          $headers = @{ 'User-Agent' = 'Solaris-build38' }
          $release = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/ClassicOldSong/Apollo/releases/tags/$tag"
          $candidates = @($release.assets | Where-Object { $_.name -match '(?i)(windows|win).*(amd64|x64).*\.exe$' })
          if ($candidates.Count -eq 0) {
            $candidates = @($release.assets | Where-Object { $_.name -match '(?i)\.exe$' })
          }
          if ($candidates.Count -eq 0) {
            Write-Host "Release assets: $($release.assets.name -join ', ')"
            throw '공식 Apollo Windows 설치 자산을 찾지 못했습니다.'
          }
          $asset = $candidates[0]
          New-Item -ItemType Directory -Force build/apollo-extract, dist/native/engine | Out-Null
          Invoke-WebRequest -Headers $headers $asset.browser_download_url -OutFile build/apollo-installer.exe
          & 7z x build/apollo-installer.exe '-obuild/apollo-extract' -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "Apollo 패키지 압축 해제 실패: $LASTEXITCODE" }
          $engine = Get-ChildItem build/apollo-extract -Recurse -File -Filter sunshine.exe | Select-Object -First 1
          if (-not $engine) { throw '압축 해제 결과에서 sunshine.exe를 찾지 못했습니다.' }
          Copy-Item "$($engine.Directory.FullName)/*" dist/native/engine -Recurse -Force
          Invoke-WebRequest -Headers $headers "https://raw.githubusercontent.com/ClassicOldSong/Apollo/$tag/LICENSE" -OutFile dist/native/APOLLO_GPLv3_LICENSE.txt
          $hash = (Get-FileHash build/apollo-installer.exe -Algorithm SHA256).Hash
          @"
          Solaris build38 bundled native engine
          Upstream: https://github.com/ClassicOldSong/Apollo
          Release: $tag
          Asset: $($asset.name)
          SHA256: $hash
          License: GPL-3.0
          Complete corresponding source: https://github.com/ClassicOldSong/Apollo/tree/$tag
          "@ | Set-Content dist/native/THIRD_PARTY_APOLLO.txt -Encoding UTF8
      - name: Verify portable package
        shell: pwsh
        run: |
          & dist/native/SolarisNativeHost.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path dist/native/engine/sunshine.exe)) { throw 'portable engine missing' }
          Copy-Item windows-native/README_KO.md dist/native/START_NATIVE_HOST_KO.md
      - name: Upload Windows native host
        uses: actions/upload-artifact@v4
        with:
          name: Solaris-Native-Host-build38-portable
          path: dist/native/
          if-no-files-found: error
          retention-days: 7
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser fixture
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Test real decoded video and restart
        run: node scripts/screen_browser_test.mjs
      - name: Keep browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: build/browser-diagnostics/
          if-no-files-found: ignore
          retention-days: 3
  build:
    needs: browser-test
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install project generator
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
          xcodebuild -version
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate source and receiver
        run: |
          python3 scripts/check_project.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m unittest discover -s receiver -p 'test_*.py' -v
          node scripts/check_viewer.mjs
          node --test tests/screen_receiver.test.mjs tests/desktop_share.test.mjs
      - name: Test shared configuration validation
        run: |
          mkdir -p build
          swiftc ios/Shared/ProbeShared.swift tests/ProbeConfigTests.swift -o build/config-tests
          build/config-tests
      - name: Build and package for local re-signing
        run: bash scripts/build_ios.sh
      - name: Keep actual Xcode project and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Solaris-build38-xcode-evidence
          path: |
            build/diagnostics/
            build/package.*/Build.xcresult/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload re-signing candidate
        uses: actions/upload-artifact@v4
        with:
          name: Solaris-0.3.2-build38-screen-modes
          path: |
            dist/Solaris-0.3.2-build38-resign.ipa
            dist/Solaris-Windows-0.3.2-build38.html
            dist/Solaris-Desktop-Share-build38.html
            dist/START_HERE_KO.md
          if-no-files-found: error
          retention-days: 3
