name: Build Solaris iOS Probe

# One push runs the checks and produces the matching app + Windows receiver.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser fixture
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Test real decoded video and restart
        run: node scripts/screen_browser_test.mjs
      - name: Keep browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-diagnostics
          path: build/browser-diagnostics/
          if-no-files-found: ignore
          retention-days: 3
  build:
    needs: browser-test
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install project generator
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen --version
          xcodebuild -version
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Validate source and receiver
        run: |
          python3 scripts/check_project.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m unittest discover -s receiver -p 'test_*.py' -v
          node scripts/check_viewer.mjs
          node --test tests/screen_receiver.test.mjs
      - name: Test shared configuration validation
        run: |
          mkdir -p build
          swiftc ios/Shared/ProbeShared.swift tests/ProbeConfigTests.swift -o build/config-tests
          build/config-tests
      - name: Build and package for local re-signing
        run: bash scripts/build_ios.sh
      - name: Keep actual Xcode project and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Solaris-build23-xcode-evidence
          path: |
            build/diagnostics/
            build/package.*/Build.xcresult/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload re-signing candidate
        uses: actions/upload-artifact@v4
        with:
          name: Solaris-0.3.2-build23-app-and-receiver
          path: |
            dist/Solaris-0.3.2-build23-resign.ipa
            dist/Solaris-Windows-0.3.2-build23.html
            dist/START_HERE_KO.md
          if-no-files-found: error
          retention-days: 3
