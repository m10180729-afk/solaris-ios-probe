<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Solaris</title><link rel="stylesheet" href="app.css"></head><body>
<header class="app-header"><strong><span class="brand-mark">◉</span> Solaris</strong><span class="header-caption">화면과 파일로 연결하세요</span><span class="spacer"></span><span class="version-tag">고화질 화면공유</span></header>
<div id="error" role="alert" hidden></div>
<p id="onboarding-status" role="status"></p><section id="onboarding" class="card" hidden><h1>Solaris 시작하기</h1><p>고유 ID로 친구를 찾고 화면과 파일을 공유하세요.</p><form id="register"><label>고유 ID<input name="user_id" minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]{3,32}" placeholder="영문·숫자·밑줄 3–32자" required></label><label>닉네임<input name="nickname" maxlength="32" required></label><button>계정 만들기</button></form><details><summary>기존 계정 복구</summary><form id="recover"><input name="email" type="email" placeholder="등록한 복구 이메일" required><button>인증 코드 받기</button></form><form id="verify"><input name="email" type="email" placeholder="복구 이메일" required><input name="token" placeholder="이메일 인증 코드" required><button>계정 복구</button></form></details></section>
<main id="workspace" hidden>
<nav id="server-rail" aria-label="서버 탐색"><button data-action="friends" class="home-icon" aria-label="친구" title="친구">◉</button><div class="rail-divider"></div><div id="servers"></div><button data-action="server-create" class="rail-add" aria-label="서버 만들기" title="서버 만들기">＋</button><button data-action="server-join" class="rail-add" aria-label="초대코드로 참여" title="초대코드로 참여">↪</button></nav>
<aside id="channel-sidebar" aria-label="채널 목록"><div class="sidebar-header"><strong id="server-title">친구 및 개인 연결</strong><div id="server-tools"></div></div><div class="sidebar-scroll"><nav class="side-navigation"><button data-action="friends">친구 목록</button><button data-action="transfers">파일 전송 기록</button></nav><h2>채널</h2><div id="channels"></div><h2><span class="live-dot"></span> 방송 중</h2><div id="broadcast-list"></div></div><footer class="self-profile"><button id="self-profile" data-action="profile" aria-label="내 프로필" title="내 프로필"></button><button data-action="settings" class="settings-icon" aria-label="설정" title="설정">⚙</button><span id="connection" role="status">연결 준비</span></footer></aside>
<button id="nav-scrim" data-action="close-nav" aria-label="채널 목록 닫기" hidden></button>
<section id="stage"><div class="stage-header"><button class="mobile-nav" id="nav-toggle" data-action="toggle-nav" aria-label="채널 목록 열기" aria-expanded="false">☰</button><span class="channel-symbol">#</span><h1 id="scope-title">친구를 선택하세요</h1><span class="spacer"></span><button class="members-toggle" data-action="toggle-people" aria-label="참여자 목록 보기" aria-expanded="false">참여자</button></div><p id="scope-status" class="muted">친구에게 화면공유를 요청하거나 서버의 채널에 참여하세요.</p><div id="viewing"><div id="videos" class="videos"></div></div><div id="panel"></div><section class="messages"><h2>연결 및 전송 메시지</h2><div id="messages" aria-live="polite"></div><form id="chat"><input name="message" maxlength="2000" aria-label="간단한 메시지" placeholder="화면공유·파일 전송을 위한 메시지"><button>보내기</button></form></section><div class="toolbar" id="session-controls"><div class="share-actions"><button data-action="share" id="share" class="primary">화면공유</button><button data-action="stop" id="stop" class="danger" hidden>화면공유 중지</button><button data-action="send-file" class="file-action">파일 보내기</button></div><button data-action="end-session" class="danger connection-end">연결 종료</button></div></section>
<aside id="people" aria-label="참여자와 요청"><h2>참여자</h2><div id="participants"></div><div class="request-section"><h2>개인 연결 요청</h2><div id="requests"></div></div></aside>
</main>
<dialog id="dialog"><button id="dialog-close" class="close">닫기</button><div id="dialog-content"></div></dialog>
<script type="module" src="app.mjs"></script></body></html>
