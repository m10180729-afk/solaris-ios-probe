<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'"><title>Solaris</title><link rel="stylesheet" href="app.css"></head><body>
<header><strong>◉ Solaris</strong><span id="connection" role="status">연결 준비</span><span class="spacer"></span><button data-action="friends">친구</button><button data-action="transfers">파일</button><button data-action="profile">내 프로필</button><button data-action="settings">설정</button></header>
<div id="error" role="alert" hidden></div>
<p id="onboarding-status" role="status"></p><section id="onboarding" class="card" hidden><h1>Solaris 시작하기</h1><p>고유 ID로 친구를 찾고 화면과 파일을 공유하세요.</p><form id="register"><label>고유 ID<input name="user_id" minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]{3,32}" placeholder="영문·숫자·밑줄 3–32자" required></label><label>닉네임<input name="nickname" maxlength="32" required></label><button>계정 만들기</button></form><details><summary>기존 계정 복구</summary><form id="recover"><input name="email" type="email" placeholder="등록한 복구 이메일" required><button>인증 코드 받기</button></form><form id="verify"><input name="email" type="email" placeholder="복구 이메일" required><input name="token" placeholder="이메일 인증 코드" required><button>계정 복구</button></form></details></section>
<main id="workspace" hidden><aside><h2>서버</h2><div id="servers"></div><button data-action="server-create">서버 만들기</button><button data-action="server-join">초대코드로 참여</button><h2>채널</h2><div id="channels"></div><div id="server-tools"></div><h2>방송 중</h2><div id="broadcast-list"></div></aside><section id="stage"><div class="toolbar"><h1 id="scope-title">친구를 선택하세요</h1><select id="quality" aria-label="공유 품질"><option value="auto">자동</option><option value="quality">화질 우선</option><option value="latency">지연시간 우선</option><option value="custom">사용자 지정</option></select><button data-action="share" id="share">화면공유</button><button data-action="stop" id="stop" hidden>화면공유 중지</button><button data-action="send-file">파일 보내기</button><button data-action="end-session">연결 종료</button></div><p id="scope-status" class="muted">음성 대화는 Discord에서 진행하세요.</p><div id="viewing"><div id="videos" class="videos"></div></div><div id="panel"></div><section class="messages"><div id="messages" aria-live="polite"></div><form id="chat"><input name="message" maxlength="2000" placeholder="화면공유·파일 전송을 위한 간단한 메시지"><button>보내기</button></form></section></section><aside id="people"><h2>참여자</h2><div id="participants"></div><h2>개인 연결 요청</h2><div id="requests"></div></aside></main>
<dialog id="dialog"><button id="dialog-close" class="close">닫기</button><div id="dialog-content"></div></dialog>
<script type="module" src="app.mjs"></script></body></html>
