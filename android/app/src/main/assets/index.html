<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.github.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Solaris</title><link rel="stylesheet" href="app.css">
</head><body>
<header class="app-header"><strong><span class="brand-mark">◉</span> Solaris</strong><span class="spacer"></span><span class="version-tag">화면공유 · 원본 파일 전송</span><nav id="window-controls" aria-label="Windows 창 조절" hidden><button data-action="window-minimize" data-icon="minimize" aria-label="창 최소화" title="창 최소화"></button><button id="window-maximize" data-action="window-maximize" data-icon="maximize" aria-label="창 최대화" title="창 최대화"></button><button id="window-fullscreen" data-action="window-fullscreen" data-icon="full" aria-label="앱 전체화면" title="앱 전체화면 · F11"></button><button data-action="window-close" data-icon="close" aria-label="창 닫기" title="창 닫기"></button></nav></header>
<div id="error" role="alert" hidden></div>
<section id="onboarding" class="auth-card" hidden>
<span class="auth-logo" aria-hidden="true">◉</span><h1>Solaris에 오신 것을 환영해요</h1><p class="muted">친구와 화면을 공유하고 원본 파일을 주고받으세요.</p>
<nav class="auth-tabs" aria-label="계정"><button data-action="auth-login">로그인</button><button data-action="auth-signup">계정 만들기</button><button data-action="auth-recover">계정 복구</button></nav><div id="google-panel"><button id="google-login" data-action="google-login" class="google-button"><span class="google-mark" aria-hidden="true">G</span> Google로 계속하기</button><div class="auth-divider"><span>또는 이메일로 계속하기</span></div></div><p id="onboarding-status" role="status"></p><div id="auth-pending" role="status" hidden>브라우저에서 인증을 마치면 Solaris로 돌아와요. <button data-action="auth-cancel-flow" class="text-button">인증 요청 취소</button></div>
<form id="login" class="stack-form"><label>이메일<input name="email" type="email" autocomplete="username" required></label><label>비밀번호<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">로그인</button><button type="button" data-action="auth-reset" class="text-button">비밀번호를 잊으셨나요?</button></form>
<form id="email-register" class="stack-form" hidden><label>고유 ID<input name="user_id" minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]{3,32}" placeholder="영문·숫자·밑줄 3–32자" required></label><label>닉네임<input name="nickname" maxlength="32" autocomplete="nickname" required></label><label>이메일<input name="email" type="email" autocomplete="email" required></label><label>비밀번호<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><button class="primary">계정 만들기</button><button type="button" data-action="auth-quick" class="text-button">ID로 빠르게 시작</button></form>
<form id="register" class="stack-form" hidden><label>고유 ID<input name="user_id" minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]{3,32}" placeholder="영문·숫자·밑줄 3–32자" required></label><label>닉네임<input name="nickname" maxlength="32" required></label><p class="muted" id="quick-help">이 기기에 계정이 저장됩니다. 나중에 이메일과 비밀번호를 연결하면 다른 기기에서도 로그인할 수 있어요.</p><button class="primary">계정 만들기</button></form>
<form id="recover" class="stack-form" hidden><label>등록한 이메일<input name="email" type="email" autocomplete="email" required></label><button class="primary">인증 코드 받기</button></form>
<form id="verify" class="stack-form" hidden><h2 id="verify-title">이메일 인증</h2><label>이메일<input name="email" type="email" required></label><label>이메일 인증 코드<input name="token" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6,10}" minlength="6" maxlength="10" required></label><p class="form-help">메일의 인증 링크를 열거나, 메일에 표시된 인증 코드를 입력하세요.</p><button class="primary">인증 완료</button><button type="button" data-action="auth-resend" class="text-button">인증 메일 다시 받기</button></form>
</section>
<main id="workspace" hidden>
<nav id="server-rail" aria-label="서버 탐색"><button data-action="friends" class="home-icon" aria-label="친구" title="친구">◉</button><div class="rail-divider"></div><div id="servers"></div><button data-action="server-create" class="rail-add" aria-label="서버 만들기" title="서버 만들기">＋</button><button data-action="server-join" class="rail-add" aria-label="초대코드로 참여" title="초대코드로 참여">↪</button></nav>
<aside id="channel-sidebar" aria-label="채널 목록"><div class="sidebar-header"><strong id="server-title">개인 메시지</strong><div id="server-tools"></div></div><div class="sidebar-scroll"><nav class="side-navigation"><button data-action="friends"><span>♧</span> 친구</button><button data-action="transfers"><span>⇄</span> 파일 전송 기록 <span id="transfer-count" class="count-badge" hidden></span></button></nav><div class="section-heading"><h2 id="channel-section-title">개인 메시지</h2><button id="channel-add" data-action="channel-create" aria-label="채널 만들기" title="채널 만들기" hidden>＋</button></div><div id="channels"></div><div class="section-heading"><h2><span class="live-dot"></span> 방송 중</h2></div><div id="broadcast-list"></div></div><div id="sidebar-connection" class="sidebar-connection" hidden></div><footer class="self-profile"><button id="self-profile" data-icon="user" data-action="profile" aria-label="내 프로필" title="내 프로필"></button><button data-icon="settings" data-action="settings" class="settings-icon" aria-label="설정" title="설정">⚙</button><span id="connection" role="status">연결 준비</span></footer></aside>
<button id="nav-scrim" data-action="close-nav" aria-label="목록 닫기" hidden></button>
<section id="stage"><div class="stage-header"><button class="mobile-nav" id="nav-toggle" data-icon="menu" data-action="toggle-nav" aria-label="채널 목록 열기" aria-expanded="false">☰</button><span id="scope-symbol" class="channel-symbol" aria-hidden="true">♧</span><span id="scope-avatar" hidden></span><h1 id="scope-title">친구</h1><div id="friend-tabs" class="friend-tabs" aria-label="친구 필터"></div><span class="spacer"></span><button class="members-toggle" data-icon="friends" data-action="toggle-people" aria-label="참여자 목록 보기" aria-expanded="false">참여자</button></div><p id="scope-status" class="muted"></p><div class="stage-scroll"><div id="panel"></div><div id="viewing"><div id="videos" class="videos"></div></div><section class="messages"><h2 id="messages-title">연결 및 전송 메시지</h2><div id="messages" role="log" aria-live="polite"></div></section></div><div class="toolbar" id="session-controls" hidden><div class="share-actions"><button data-icon="screen" data-action="share" id="share" class="primary">화면공유</button><button data-icon="stop" data-action="stop" id="stop" class="danger" hidden>화면공유 중지</button><button data-icon="files" data-action="send-file" class="file-action">파일 보내기</button></div><button data-icon="leave" data-action="end-session" class="danger connection-end">연결 종료</button></div><div id="composer-help" class="composer-help"></div><form id="chat"><textarea name="message" maxlength="2000" rows="1" aria-label="메시지" placeholder="친구에게 메시지 보내기" disabled></textarea><button data-icon="send" aria-label="메시지 보내기" disabled>➤</button></form></section>
<aside id="people" aria-label="참여자와 요청"><h2 id="participants-title">온라인 친구</h2><div id="participants"></div><div class="request-section"><h2>화면공유 요청 <span id="request-count" class="count-badge" hidden></span></h2><div id="requests"></div></div></aside>
</main>
<nav id="mobile-tabs" class="mobile-tabs" aria-label="주요 메뉴" hidden><button data-action="mobile-menu" data-icon="message" aria-label="대화와 채널 목록"><span>대화</span></button><button data-action="mobile-friends" data-icon="friends" aria-label="친구 목록"><span>친구</span></button><button data-action="mobile-files" data-icon="files" aria-label="파일 전송 기록"><span>파일</span></button><button data-action="mobile-profile" data-icon="user" aria-label="내 프로필"><span>나</span></button></nav>
<dialog id="dialog" aria-labelledby="dialog-title"><button id="dialog-close" class="close" aria-label="대화상자 닫기">✕</button><div id="dialog-content"></div></dialog>
<script type="module" src="app.mjs"></script></body></html>
