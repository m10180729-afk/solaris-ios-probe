name: SolarisProbe
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.3.2'
    CURRENT_PROJECT_VERSION: '5'
    GENERATE_INFOPLIST_FILE: 'NO'
    CODE_SIGNING_ALLOWED: 'NO'
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
targets:
  SolarisProbe:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.solaris.probe
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Probe.entitlements
    dependencies:
      - target: SolarisBroadcast
        embed: true
        codeSign: false
  SolarisBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
        excludes: [Info.plist]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.solaris.probe.broadcast
        INFOPLIST_FILE: Broadcast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/Probe.entitlements
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SKIP_INSTALL: 'YES'
    dependencies:
      - package: WebRTC
schemes:
  SolarisProbe:
    build:
      targets:
        SolarisProbe: all
