name: SolarisProbe
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.3.2'
    CURRENT_PROJECT_VERSION: '14'
    GENERATE_INFOPLIST_FILE: 'NO'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  SolarisProbe:
    type: application
    platform: iOS
    transitivelyLinkDependencies: false
    sources:
      - path: App
        excludes: [Info.plist]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.solaris.probe
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
    dependencies:
      - target: SolarisBroadcast
        embed: true
        codeSign: false
  SolarisBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
        excludes: [Info.plist]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.solaris.probe.broadcast
        INFOPLIST_FILE: Broadcast/Info.plist
        APPLICATION_EXTENSION_API_ONLY: 'YES'
        SKIP_INSTALL: 'YES'
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/Frameworks'
        CODE_SIGN_ENTITLEMENTS: Config/Broadcast.entitlements
    dependencies:
      # Downloaded and checksum-verified BEFORE XcodeGen by prepare_webrtc.py.
      # A file reference lets Xcode process the XCFramework's real iOS slice.
      - framework: Vendor/WebRTC.xcframework
        embed: true
        codeSign: false
schemes:
  SolarisProbe:
    build:
      targets:
        SolarisProbe: all
